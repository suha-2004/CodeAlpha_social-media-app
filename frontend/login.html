<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Login</title>

  <link
    rel="stylesheet"
    href="css/style.css"
  >

</head>

<body class="auth-body">


  <!-- ================= LOGIN CONTAINER ================= -->

  <div class="auth-container">

    <div class="auth-card">


      <!-- LOGO -->
      <h1 class="auth-logo">
        SocialSphere 🚀
      </h1>

      <p class="auth-subtitle">
        Welcome back! Login to continue
      </p>


      <!-- EMAIL -->
      <input
        type="email"
        id="email"
        placeholder="Enter your email"
      >


      <!-- PASSWORD -->
      <input
        type="password"
        id="password"
        placeholder="Enter your password"
      >


      <!-- LOGIN BUTTON -->
      <button onclick="login()">
        Login 🚀
      </button>


      <!-- MESSAGE -->
      <p id="msg"></p>


      <!-- REGISTER LINK -->
      <p class="auth-link">

        Don't have an account?

        <a href="register.html">
          Register
        </a>

      </p>

    </div>

  </div>


  <!-- SCRIPT -->
  <script src="js/auth.js"></script>

</body>

</html>
