<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Register</title>

  <link
    rel="stylesheet"
    href="css/style.css"
  >

</head>

<body class="auth-body">


  <!-- ================= REGISTER CARD ================= -->

  <div class="auth-container">

    <div class="auth-card">


      <!-- LOGO -->
      <h1 class="auth-logo">
        SocialSphere 🚀
      </h1>

      <p class="auth-subtitle">
        Create your account and connect with people
      </p>


      <!-- USERNAME -->
      <input
        type="text"
        id="username"
        placeholder="Enter username"
      >


      <!-- EMAIL -->
      <input
        type="email"
        id="email"
        placeholder="Enter email"
      >


      <!-- PASSWORD -->
      <input
        type="password"
        id="password"
        placeholder="Enter password"
      >


      <!-- REGISTER BUTTON -->
      <button onclick="register()">
        Create Account 🚀
      </button>


      <!-- MESSAGE -->
      <p id="msg"></p>


      <!-- LOGIN LINK -->
      <p class="auth-link">

        Already have an account?

        <a href="login.html">
          Login
        </a>

      </p>

    </div>

  </div>


  <script src="js/register.js"></script>

</body>

</html>
